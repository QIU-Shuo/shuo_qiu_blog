<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 440" role="img" aria-labelledby="title desc">
  <title id="title">Share of coding benchmark tasks flagged or revised by later audits</title>
  <desc id="desc">Horizontal stacked bars show HumanEval at 11 percent flagged, the original SWE-bench audit sample at 68.3 percent flagged, SWE-bench Verified with 16.4 percent of all 500 tasks confirmed problematic in the targeted 2026 re-audit, SWE-bench Pro at about 30 percent flagged, and Terminal-Bench 2.0 with 31.5 percent revised. For SWE-bench Verified, another 11.2 percent were re-audited without a material issue found and 72.4 percent were not included in the targeted re-audit.</desc>

  <defs>
    <pattern id="not-reaudited" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f3f4f6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/>
    </pattern>
    <style>
      .sans { font-family: var(--font-ibm-plex-sans), "IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: var(--font-ibm-plex-mono), "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #111827; font-size: 14px; font-weight: 500; }
      .detail { fill: #6b7280; font-size: 11px; }
      .tick { fill: #6b7280; font-size: 11px; }
      .inside-light { fill: #ffffff; font-size: 12px; font-weight: 500; }
      .inside-dark { fill: #374151; font-size: 12px; font-weight: 500; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .outline { fill: none; stroke: #d1d5db; stroke-width: 1; }
      .flagged { fill: #b45309; }
      .not-flagged { fill: #d1d5db; }
    </style>
  </defs>

  <!-- Axis -->
  <text class="sans detail" x="200" y="18">Share of tasks in the stated denominator</text>
  <g class="mono tick" text-anchor="middle">
    <text x="200" y="39">0%</text>
    <text x="310" y="39">25%</text>
    <text x="420" y="39">50%</text>
    <text x="530" y="39">75%</text>
    <text x="640" y="39">100%</text>
  </g>
  <g class="grid">
    <line x1="200" y1="47" x2="200" y2="357"/>
    <line x1="310" y1="47" x2="310" y2="357"/>
    <line x1="420" y1="47" x2="420" y2="357"/>
    <line x1="530" y1="47" x2="530" y2="357"/>
    <line x1="640" y1="47" x2="640" y2="357"/>
  </g>

  <!-- HumanEval -->
  <g>
    <text class="sans label" x="18" y="69">HumanEval</text>
    <text class="sans detail" x="18" y="86">164 tasks</text>
    <rect class="flagged" x="200" y="55" width="48.4" height="32"/>
    <rect class="not-flagged" x="248.4" y="55" width="391.6" height="32"/>
    <rect class="outline" x="200" y="55" width="440" height="32"/>
    <text class="mono inside-light" x="224.2" y="75" text-anchor="middle">11%</text>
  </g>

  <!-- Original SWE-bench -->
  <g>
    <text class="sans label" x="18" y="130">SWE-bench</text>
    <text class="sans detail" x="18" y="147">1,699-task audit sample</text>
    <rect class="flagged" x="200" y="116" width="300.52" height="32"/>
    <rect class="not-flagged" x="500.52" y="116" width="139.48" height="32"/>
    <rect class="outline" x="200" y="116" width="440" height="32"/>
    <text class="mono inside-light" x="350.26" y="136" text-anchor="middle">68.3%</text>
  </g>

  <!-- SWE-bench Verified -->
  <g>
    <text class="sans label" x="18" y="191">SWE-bench Verified</text>
    <text class="sans detail" x="18" y="208">500 tasks</text>
    <rect class="flagged" x="200" y="177" width="72.16" height="32"/>
    <rect class="not-flagged" x="272.16" y="177" width="49.28" height="32"/>
    <rect x="321.44" y="177" width="318.56" height="32" fill="url(#not-reaudited)"/>
    <rect class="outline" x="200" y="177" width="440" height="32"/>
    <text class="mono inside-light" x="236.08" y="197" text-anchor="middle">16.4%</text>
    <text class="mono inside-dark" x="296.8" y="197" text-anchor="middle">11.2%</text>
    <path d="M200 215 v5 h121.44 v-5" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text class="sans detail" x="200" y="235">82 of 138 re-audited tasks were flagged (59.4%)</text>
  </g>

  <!-- SWE-bench Pro -->
  <g>
    <text class="sans label" x="18" y="280">SWE-bench Pro</text>
    <text class="sans detail" x="18" y="297">full-dataset estimate</text>
    <rect class="flagged" x="200" y="266" width="132" height="32"/>
    <rect class="not-flagged" x="332" y="266" width="308" height="32"/>
    <rect class="outline" x="200" y="266" width="440" height="32"/>
    <text class="mono inside-light" x="266" y="286" text-anchor="middle">~30%</text>
  </g>

  <!-- Terminal-Bench -->
  <g>
    <text class="sans label" x="18" y="341">Terminal-Bench 2.0</text>
    <text class="sans detail" x="18" y="358">89 tasks</text>
    <rect class="flagged" x="200" y="327" width="138.6" height="32"/>
    <rect class="not-flagged" x="338.6" y="327" width="301.4" height="32"/>
    <rect class="outline" x="200" y="327" width="440" height="32"/>
    <text class="mono inside-light" x="269.3" y="347" text-anchor="middle">31.5%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(18 393)">
    <rect class="flagged" x="0" y="0" width="16" height="16"/>
    <text class="sans detail" x="24" y="12">Flagged or revised</text>

    <rect class="not-flagged" x="158" y="0" width="16" height="16"/>
    <text class="sans detail" x="182" y="12">Not flagged in cited review</text>

    <rect x="395" y="0" width="16" height="16" fill="url(#not-reaudited)" stroke="#d1d5db"/>
    <text class="sans detail" x="419" y="12">Not included in cited re-audit</text>
  </g>
</svg>
